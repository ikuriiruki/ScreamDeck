name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # rust-embed reads ../dist at compile time, a fresh clone has none
      - run: pnpm build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Check the updater public key is set
        shell: bash
        run: |
          if grep -q REPLACE_WITH_PUBLIC_KEY src-tauri/tauri.conf.json; then
            echo "::error file=src-tauri/tauri.conf.json::plugins.updater.pubkey is still REPLACE_WITH_PUBLIC_KEY. Run 'pnpm tauri signer generate', put the public key there and the private key in the TAURI_SIGNING_PRIVATE_KEY secret."
            exit 1
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ScreamDeck ${{ github.ref_name }}'
          includeUpdaterJson: true
